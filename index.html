<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WebAR — Image Tracking (MindAR)</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      background: #000;
    }

    a-scene,
    a-scene > canvas,
    a-scene > video,
    .mindar-ui-overlay,
    .mindar-ui-scanning,
    .mindar-ui-loading {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      display: block !important;
    }

    /* Кнопка запуска камеры */
    #start-btn {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      padding: 16px 32px;
      font-size: 18px;
      font-family: system-ui, sans-serif;
      color: #fff;
      background: #007aff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    #start-btn:active {
      background: #005bb5;
    }

    .hint {
      position: fixed;
      bottom: 16px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 14px;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 10;
      display: none;
    }

    /* Когда камера запущена — скрываем кнопку, показываем подсказку */
    body.started #start-btn { display: none; }
    body.started .hint { display: block; }
  </style>
</head>
<body>

  <!-- Кнопка запуска камеры -->
  <button id="start-btn">Запустить AR</button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiScanning: no; uiError: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >

    <a-assets>
      <a-asset-item id="model" src="./Fitness_Character.glb"></a-asset-item>
    </a-assets>

    <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.8" position="1 2 1"></a-light>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model
        src="#model"
        position="0 0 0"
        scale="0.1 0.1 0.1"
        rotation="0 0 0"
      ></a-gltf-model>
    </a-entity>

  </a-scene>

  <p class="hint">Наведите камеру на маркер</p>

  <script>
    // Запуск камеры по клику на кнопку
    document.getElementById('start-btn').addEventListener('click', function () {
      const sceneEl = document.querySelector('a-scene');
      const arSystem = sceneEl.systems['mindar-image-system'];

      if (arSystem) {
        arSystem.start();
        document.body.classList.add('started');
      } else {
        console.error('MindAR system не найден');
      }
    });
  </script>

</body>
</html>
